name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  smoke:
    runs-on: ubuntu-latest
    env:
      # Runs on master, including the weekly one, build the images from scratch, so that upstream changes that break
      # the build show up, and cache them for pull requests and tags.
      REFRESH_IMAGES: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go build -o "$RUNNER_TEMP/mwenv" ./cmd/mwenv
      - run: echo "IMAGES_CACHE=smoke-images-${{ hashFiles('internal/docker/build/**') }}" >> "$GITHUB_ENV"
      - name: Restore images
        id: restore-images
        if: env.REFRESH_IMAGES == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/images.tar
          key: ${{ env.IMAGES_CACHE }}
          restore-keys: ${{ env.IMAGES_CACHE }}-
      - if: steps.restore-images.outputs.cache-matched-key != ''
        run: docker load --input "$RUNNER_TEMP/images.tar"
      - name: Create an extension
        run: |
          mkdir "$RUNNER_TEMP/SmokeTest"
          cd "$RUNNER_TEMP/SmokeTest"
          git init -q
          echo '{ "name": "Smoke Test", "manifest_version": 2 }' > extension.json
      - name: Start, use and destroy an environment
        working-directory: ${{ runner.temp }}/SmokeTest
        run: |
          "$RUNNER_TEMP/mwenv" start
          wiki=$("$RUNNER_TEMP/mwenv" status --json | jq -r '.url | sub("/wiki/Main_Page$"; "")')
          curl -fsS "$wiki/wiki/Special:Version" | grep -q 'Smoke Test'
          curl -sS "$wiki/w/rest.php/v1/page/Foo%2FBar" | jq -e '.httpCode == 404'
          "$RUNNER_TEMP/mwenv" run -- php ../../maintenance/run.php showSiteStats
          "$RUNNER_TEMP/mwenv" destroy
          test "$("$RUNNER_TEMP/mwenv" ls --json)" = "[]"
      - name: Save images
        if: env.REFRESH_IMAGES == 'true'
        run: |
          docker save --output "$RUNNER_TEMP/images.tar" \
            $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^(mwenv-|mariadb:)')
      - if: env.REFRESH_IMAGES == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/images.tar
          key: ${{ env.IMAGES_CACHE }}-${{ github.run_id }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build binaries
        run: |
          # Named after `uname -s` and `uname -m`, which the README's download command uses
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/mwenv-$3" ./cmd/mwenv
          }
          build darwin amd64 Darwin-x86_64
          build darwin arm64 Darwin-arm64
          build linux amd64 Linux-x86_64
          build linux arm64 Linux-aarch64
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
