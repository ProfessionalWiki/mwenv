name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  smoke:
    runs-on: ubuntu-latest
    env:
      # The weekly and manual runs build the images from scratch, so that upstream changes that break the build show
      # up. Other runs reuse the cached images.
      REFRESH_IMAGES: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go build -o "$RUNNER_TEMP/mwenv" ./cmd/mwenv
      - run: echo "IMAGES_CACHE=smoke-images-${{ hashFiles('internal/docker/build/**') }}" >> "$GITHUB_ENV"
      - name: Restore images
        id: restore-images
        if: env.REFRESH_IMAGES == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/images.tar
          key: ${{ env.IMAGES_CACHE }}
          restore-keys: ${{ env.IMAGES_CACHE }}-
      - if: steps.restore-images.outputs.cache-matched-key != ''
        run: docker load --input "$RUNNER_TEMP/images.tar"
      - name: Create an extension
        run: |
          mkdir "$RUNNER_TEMP/SmokeTest"
          cd "$RUNNER_TEMP/SmokeTest"
          git init -q
          echo '{ "name": "Smoke Test", "manifest_version": 2 }' > extension.json
      - name: Start, use and destroy an environment
        working-directory: ${{ runner.temp }}/SmokeTest
        run: |
          "$RUNNER_TEMP/mwenv" start
          wiki=$("$RUNNER_TEMP/mwenv" status --json | jq -r '.url | sub("/wiki/Main_Page$"; "")')
          curl -fsS "$wiki/wiki/Special:Version" | grep -q 'Smoke Test'
          curl -sS "$wiki/w/rest.php/v1/page/Foo%2FBar" | jq -e '.httpCode == 404'
          "$RUNNER_TEMP/mwenv" run -- php ../../maintenance/run.php showSiteStats
          "$RUNNER_TEMP/mwenv" stop
          "$RUNNER_TEMP/mwenv" start
          "$RUNNER_TEMP/mwenv" destroy
          test "$("$RUNNER_TEMP/mwenv" ls --json)" = "[]"
      # Only where the images were just built: loaded images come without the build cache, so a rebuild would take
      # minutes.
      - name: Rebuild the images under an existing environment
        if: env.REFRESH_IMAGES == 'true'
        working-directory: ${{ runner.temp }}/SmokeTest
        run: |
          "$RUNNER_TEMP/mwenv" start
          old=$(docker image ls --quiet --no-trunc mwenv-core)
          "$RUNNER_TEMP/mwenv" rebuild
          test "$(docker image ls --quiet --no-trunc mwenv-core)" != "$old"
          web=$(docker ps --quiet --filter label=com.docker.compose.service=web)
          test "$(docker inspect --format '{{.Image}}' "$web")" = "$old"
          "$RUNNER_TEMP/mwenv" start
          "$RUNNER_TEMP/mwenv" destroy
          test -z "$(docker image ls --quiet --filter dangling=true --filter label=wiki.professional.mwenv=true)"
      # Whenever the images were built, but only on master: pull requests and tags can restore master's cache only.
      - name: Save images
        if: github.ref == 'refs/heads/master' && steps.restore-images.outputs.cache-matched-key == ''
        run: |
          docker save --output "$RUNNER_TEMP/images.tar" \
            $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^(mwenv-|mariadb:)')
      - if: github.ref == 'refs/heads/master' && steps.restore-images.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/images.tar
          key: ${{ env.IMAGES_CACHE }}-${{ github.run_id }}

  package:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build the release archives
        run: |
          # Named after `uname -s` and `uname -m`, which the README's download command uses. Built outside the
          # checkout, since Go marks a binary built in a checkout with untracked files as +dirty.
          archive() {
            dir="$RUNNER_TEMP/build/$3"
            mkdir -p "$dir" "$RUNNER_TEMP/dist"
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$dir/mwenv" ./cmd/mwenv
            cp LICENSE README.md "$dir"
            tar -czf "$RUNNER_TEMP/dist/mwenv-$3.tar.gz" -C "$dir" mwenv LICENSE README.md
          }
          archive darwin amd64 Darwin-x86_64
          archive darwin arm64 Darwin-arm64
          archive linux amd64 Linux-x86_64
          archive linux arm64 Linux-aarch64
      - name: Check the Linux x86_64 archive
        run: |
          tar -xzf "$RUNNER_TEMP/dist/mwenv-Linux-x86_64.tar.gz" -C "$RUNNER_TEMP" mwenv
          version=$("$RUNNER_TEMP/mwenv" version)
          echo "$version"
          # A release must report exactly its tag, without +dirty.
          if [[ $GITHUB_REF == refs/tags/* ]]; then test "$version" = "$GITHUB_REF_NAME"; fi
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
